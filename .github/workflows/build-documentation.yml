name: Build documentation

on:
  workflow_dispatch:
    inputs:
      custom-path:
        description: 'Custom path to deploy documentation to'
        required: false
        default: ''
  release:
    types:
      - created

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: 3.x

    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/setup.cfg') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      shell: bash
      run: |
        pip install -U pip
        pip install -e .[docs]

    - name: Build Sphinx documentation
      shell: bash
      run: |
        python -m sphinx -T -b html -d _build/doctrees -D language=en docsrc docs_compiled

    - name: Resolve url path
      id: resolve_url_path
      shell: bash
      env:
        CUSTOM_PATH: ${{ github.event.inputs.custom-path }}
        GITHUB_REF_NAME: ${{ github.ref_name }}
        GITHUB_RELEASE_TAG_NAME: ${{ github.event.release.tag_name }}
      run: |
        if [[ -n "${CUSTOM_PATH}" ]]; then
            echo "path=${CUSTOM_PATH}" >> $GITHUB_OUTPUT
        # 0.x releases deploy to 0.x path, all other releases deploy to latest path
        elif [[ "${{ github.event_name }}" == "release" && "${GITHUB_RELEASE_TAG_NAME}" == 0.* ]]; then
            echo "path=0.x" >> $GITHUB_OUTPUT
        # for manual builds deploy to the branch name path
        elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "path=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
        else
            echo "path=latest" >> $GITHUB_OUTPUT
        fi

    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./docs_compiled
        destination_dir: sdk_documentation/${{ steps.resolve_url_path.outputs.path }}
        keep_files: true

    - name: Add URL to the Job Summary
      shell: bash
      run: |
        url="https://python.docs.firebolt.io/sdk_documentation/${{ steps.resolve_url_path.outputs.path }}"
        echo "[Documentation]($url)" >> $GITHUB_STEP_SUMMARY
