name: Core integration tests

on:
  workflow_dispatch:
    inputs:
      tag_version:
        description: 'The docker image tag for the firebolt core'
        required: false
        type: string
      python_version:
        description: 'Python version'
        required: false
        type: string
        default: '3.10'
      os_name:
        description: 'The operating system'
        required: false
        type: string
        default: 'ubuntu-latest'
  workflow_call:
    inputs:
      tag_version:
        description: 'The docker image tag for the firebolt core'
        required: false
        type: string
      python_version:
        description: 'Python version'
        required: false
        type: string
        default: '3.10'
      os_name:
        description: 'Operating system'
        required: false
        type: string
        default: 'ubuntu-latest'
      sendSlackNotifications:
        description: 'Send Slack notifications on failure'
        required: false
        type: boolean
        default: false
    secrets:
      SLACK_BOT_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  run-core-integration-tests:
    permissions:
      contents: read
    runs-on: ${{ inputs.os_name }}
    steps:
      - name: Check out code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: 'firebolt-db/firebolt-python-sdk'

      - name: Setup Firebolt Core
        id: setup-core
        uses: firebolt-db/action-setup-core@c1a5dc8d2f54509084037487c6ff71643f695790 # main
        with:
          tag_version: ${{ inputs.tag_version || vars.DEFAULT_CORE_IMAGE_TAG }}

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ inputs.python_version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"

      - name: Run integration tests HTTP
        env:
          SERVICE_ID: ""
          SERVICE_SECRET: ""
          DATABASE_NAME: "firebolt"
          ENGINE_NAME: ""
          STOPPED_ENGINE_NAME: ""
          API_ENDPOINT: ""
          ACCOUNT_NAME: ""
          CORE_URL: ${{ steps.setup-core.outputs.service_url }}
        run: |
          pytest -o log_cli=true -o log_cli_level=WARNING tests/integration -k "core"

      - name: Run integration tests HTTPS
        env:
          SERVICE_ID: ""
          SERVICE_SECRET: ""
          DATABASE_NAME: "firebolt"
          ENGINE_NAME: ""
          STOPPED_ENGINE_NAME: ""
          API_ENDPOINT: ""
          ACCOUNT_NAME: ""
          CORE_URL: ${{ steps.setup-core.outputs.service_https_url }}
        run: |
          pytest -o log_cli=true -o log_cli_level=WARNING tests/integration -k "core"
