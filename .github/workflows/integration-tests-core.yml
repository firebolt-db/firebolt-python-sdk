name: Core integration tests

on:
  workflow_dispatch:
    inputs:
      tag_version:
        description: 'The docker image tag for the firebolt core'
        required: false
        type: string
      python_version:
        description: 'Python version'
        required: false
        type: string
        default: '3.10'
      os_name:
        description: 'The operating system'
        required: false
        type: string
        default: 'ubuntu-latest'
  workflow_call:
    inputs:
      tag_version:
        description: 'The docker image tag for the firebolt core'
        required: false
        type: string
      python_version:
        description: 'Python version'
        required: false
        type: string
        default: '3.10'
      os_name:
        description: 'Operating system'
        required: false
        type: string
        default: 'ubuntu-latest'
      sendSlackNotifications:
        description: 'Send Slack notifications on failure'
        required: false
        type: boolean
        default: false
    secrets:
      SLACK_BOT_TOKEN:
        required: false
jobs:
  run-core-integration-tests:
    permissions:
      contents: write # Push allure reports to gh-pages
      statuses: write # Update status on PR
    runs-on: ${{ inputs.os_name }}
    steps:
      - name: Check out code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: 'firebolt-db/firebolt-python-sdk'

      - name: Install Firebolt
        env:
          ENGINE_TAG: ${{ inputs.tag_version || vars.DEFAULT_CORE_IMAGE_TAG || 'dev' }}
        run: |
          bash <(curl -fsSL https://get.firebolt.io/) < /dev/null

      - name: Start Firebolt
        env:
          ENGINE_REPO: ghcr.io/firebolt-db/engine
          ENGINE_TAG: ${{ inputs.tag_version || vars.DEFAULT_CORE_IMAGE_TAG || 'dev' }}
        run: |
          mkdir -p -m 777 firebolt-data
          docker run \
            --detach \
            --user firebolt \
            --name firebolt \
            --rm \
            --ulimit memlock=8589934592:8589934592 \
            --security-opt seccomp=unconfined \
            -v "${PWD}/firebolt-data:/var/lib/firebolt" \
            -p 3473:3473 \
            "${ENGINE_REPO}:${ENGINE_TAG}"

          timeout=60
          until [ "$timeout" -eq 0 ]; do
            response="$(
              curl -s 'http://localhost:3473/?output_format=TabSeparatedWithNamesAndTypes' \
                --data-binary 'SELECT 42;' || true
            )"
            if [ "$response" = $'?column?\nint\n42' ]; then
              exit 0
            fi
            sleep 1
            timeout=$((timeout - 1))
          done

          docker logs firebolt
          exit 1

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ inputs.python_version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"

      - name: Run integration tests
        env:
          SERVICE_ID: ${{ secrets.FIREBOLT_CLIENT_ID_STG_NEW_IDN }}
          SERVICE_SECRET: ${{ secrets.FIREBOLT_CLIENT_SECRET_STG_NEW_IDN }}
          DATABASE_NAME: "firebolt"
          ENGINE_NAME: ""
          STOPPED_ENGINE_NAME: ""
          API_ENDPOINT: ""
          ACCOUNT_NAME: ""
          CORE_URL: http://localhost:3473
        run: |
          pytest -o log_cli=true -o log_cli_level=WARNING tests/integration -k "core" --alluredir=allure-results/

      - name: Allure Reports
        uses: firebolt-db/action-allure-report@8cdc116f65f6eca845a992e347e72b75ca8ccf5f # v2.1.1
        if: always()
        with:
          github-token: ${{ github.token }}
          pages-branch: gh-pages
          mapping-json: |
            {
              "allure-results": "core"
            }
