name: Core integration tests

on:
  workflow_dispatch:
    inputs:
      tag_version:
        description: 'The docker image tag for the firebolt core'
        required: false
        type: string
      python_version:
        description: 'Python version'
        required: false
        type: string
        default: '3.10'
      os_name:
        description: 'The operating system'
        required: false
        type: string
        default: 'ubuntu-latest'
  workflow_call:
    inputs:
      tag_version:
        description: 'The docker image tag for the firebolt core'
        required: false
        type: string
      python_version:
        description: 'Python version'
        required: false
        type: string
        default: '3.10'
      os_name:
        description: 'Operating system'
        required: false
        type: string
        default: 'ubuntu-latest'
      sendSlackNotifications:
        description: 'Send Slack notifications on failure'
        required: false
        type: boolean
        default: false
    secrets:
      SLACK_BOT_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  run-core-integration-tests:
    permissions:
      contents: read
    runs-on: ${{ inputs.os_name }}
    env:
      CORE_IMAGE_TAG: ${{ inputs.tag_version || vars.DEFAULT_CORE_IMAGE_TAG }}
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: 'firebolt-db/firebolt-python-sdk'

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ inputs.python_version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"

      - name: "Compose: Run integration tests HTTP"
        env:
          SERVICE_ID: ""
          SERVICE_SECRET: ""
        run: |
          pytest -o log_cli=true -o log_cli_level=WARNING tests/integration -k "core" --run-compose

      - name: "Compose: Run integration tests HTTPS"
        env:
          SERVICE_ID: ""
          SERVICE_SECRET: ""
        run: |
          pytest -o log_cli=true -o log_cli_level=WARNING tests/integration -k "core" --run-https --run-compose

      - name: "Kind: Run integration tests HTTP"
        env:
          CORE_HELM_CHART_VERSION: "0.3.0"
          CORE_IMAGE_TAG: ${{ inputs.tag_version || vars.DEFAULT_CORE_IMAGE_TAG }}
        run: |
          pytest -o log_cli=true -o log_cli_level=WARNING tests/integration -k "core" --run-kind
