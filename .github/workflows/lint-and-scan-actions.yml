# Lint and security-scan GitHub Actions workflow files.
#
# Runs actionlint (structural/logic checks) and zizmor (security audit)
# as parallel jobs whenever files under .github/ are modified.
#
# zizmor results appear in the repository's Security tab (GitHub Advanced
# Security). The workflow does not fail on findings; use GitHub rulesets
# to block merges on unresolved alerts.

name: Lint & Scan GitHub Actions

on:
  push:
    branches: ["main"]
    paths: [".github/**"]
  pull_request:
    branches: ["**"]
    paths: [".github/**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  actionlint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write      # needed for github-pr-check reporter
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run actionlint
        uses: reviewdog/action-actionlint@619a81ec64ff8c0211cd6146eb2b21e8f1d7f440 # v1.81.1
        with:
          reporter: github-pr-check
          fail_level: error

  zizmor:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read     # needed for private repos
      actions: read      # needed for private repos
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
