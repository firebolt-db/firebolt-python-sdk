[metadata]
name = firebolt_sdk
version = attr: firebolt.__version__
description = Python SDK for Firebolt
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/firebolt-db/firebolt-sdk
author = Firebolt
author_email = support@firebolt.io
license = Apache-2.0
license_files = LICENSE
classifiers =
    Operating System :: OS Independent
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3 :: Only
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    Programming Language :: Python :: 3.13
    Programming Language :: Python :: 3.14
project_urls =
    Bug Tracker = https://github.com/firebolt-db/firebolt-sdk/issues

[options]
packages = find:
install_requires =
    aiorwlock==1.5.1
    anyio>=4.15.1
    appdirs>=1.4.4
    appdirs-stubs>=0.2.0
    async-generator>=1.10
    async-property>=0.2.2
    cryptography>=50.0.2
    httpcore>=1.0.9
    httpx[http2]>=0.28.1
    pydantic>=2.13.5,<3.0.0
    python-dateutil>=2.9.0.post0
    readerwriterlock>=1.0.9
    sqlparse==0.6.0
    trio>=0.34.0
    truststore>=0.10.4
python_requires = >=3.10
include_package_data = True
package_dir =
    = src

[options.packages.find]
where = src

[options.extras_require]
ciso8601 =
    ciso8601==2.3.3
dev =
    devtools==0.12.2
    mypy>=2.4.0,<3
    pre-commit==4.6.2
    psutil==7.2.2
    pyfakefs>=6.2.0,<7
    pytest==9.1.1
    pytest-cov==7.1.0
    pytest-httpx>=0.36.2
    pytest-mock==3.16.0
    pytest-timeout==2.4.0
    pytest-trio==0.8.0
    pytest-xdist==3.8.0
    trio-typing[mypy]>=0.10,<0.11
    types-cryptography==3.3.23.2
docs =
    sphinx>=8.1.3,<10
    sphinx-rtd-theme>=3.1.0,<4

[options.package_data]
firebolt = py.typed

[mypy]
disallow_untyped_defs = True
show_error_codes = True
files = src/
plugins = pydantic.mypy

[tool:pytest]
trio_mode = true
